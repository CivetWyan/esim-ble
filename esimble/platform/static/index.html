<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>eSIM 接码平台</title>
<style>
:root{
  --primary:#3c96ca;--primary-d:#2f86bd;--primary-l:#e8f3fa;--bg:#f3f6f9;--surface:#fff;--fg:#1b1c1d;--fg2:#5f6b76;--line:#e3e8ee;
  --ok:#00a854;--ok-l:#e3f8ec;--warn:#e69500;--warn-l:#fff6e0;--bad:#e5484d;--bad-l:#fdecec;--code-bg:#fff4cc;--code-fg:#7a4b00;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--r:10px;
}
@media (prefers-color-scheme:dark){:root{
  --primary:#5ba4d4;--primary-d:#3a8ab8;--primary-l:#1a2e3d;--bg:#161718;--surface:#222324;--fg:#e8eaed;--fg2:#9aa3ad;--line:#33363a;
  --ok:#3ecf8e;--ok-l:#163626;--warn:#f5b13d;--warn-l:#3a2e12;--bad:#ff6b6b;--bad-l:#3d1d1d;--code-bg:#3d3210;--code-fg:#ffd666;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--primary);text-decoration:none}
svg.i{width:18px;height:18px;flex:none;fill:currentColor}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;font-weight:600;font-size:16px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
nav{padding:6px 12px;flex:1;overflow:auto}
nav .grp{font-size:12px;color:var(--fg2);padding:14px 10px 6px}
nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:var(--fg2);margin-bottom:2px}
nav a:hover{color:var(--primary)}
nav a.act{background:var(--primary-l);color:var(--primary);font-weight:600}
nav a .cnt{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;font-size:12px;color:var(--fg2);display:flex;flex-direction:column;gap:8px}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.topbar h1{font-size:18px;margin:0;font-weight:600}
.topbar .sp{flex:1}
.page{padding:24px 28px 40px;max-width:1240px;width:100%}
.menu-btn{display:none;background:none;border:0;color:var(--fg);padding:6px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;z-index:30;width:240px;transform:translateX(-100%);transition:.2s}
  aside.open{transform:none;box-shadow:0 0 40px #0004}
  .menu-btn{display:block}.page{padding:16px}.topbar{padding:0 16px}
}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:600}.card-h .sp{flex:1}
.card-b{padding:16px 20px}
.grid{display:grid;gap:20px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:320px minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side,.g2{grid-template-columns:1fr}}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center;margin:0}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--primary-l);color:var(--primary);flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .lab{font-size:12px;color:var(--fg2)}.kpi .val{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:12px;color:var(--fg2)}
.btn{font:inherit;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}.btn.pri:hover{background:var(--primary-d)}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}.btn.lg{height:42px;padding:0 22px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;background:var(--primary-l);color:var(--primary);white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.mut{background:var(--bg);color:var(--fg2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pulse{animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.3}}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--fg2);font-size:12px;text-align:left;padding:10px 12px;background:var(--bg);white-space:nowrap}
td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.mut{color:var(--fg2)}.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px 18px;align-items:center;max-width:760px}
.form .hint{grid-column:2;margin-top:-8px;font-size:12px;color:var(--fg2)}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .hint{grid-column:1}}
input,select,textarea{font:inherit;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;outline:none}
textarea{height:auto;min-height:80px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:11px;cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--primary)}.switch input:checked+span:before{transform:translateX(16px)}
.empty{padding:36px;text-align:center;color:var(--fg2)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:var(--warn-l);color:var(--fg);font-size:13px;margin-bottom:16px}
.alert svg{color:var(--warn)}.alert.info{background:var(--primary-l)}.alert.info svg{color:var(--primary)}

/* messages */
.msg{padding:12px 20px;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .h{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--fg2)}
.msg .h b{color:var(--fg);font-size:13px}
.msg .body{white-space:pre-wrap;word-break:break-word;margin-top:4px}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;background:var(--code-bg);color:var(--code-fg);padding:1px 8px;border-radius:6px;cursor:pointer}
.code.big{font-size:30px;padding:4px 16px;letter-spacing:2px}
.new{animation:fl 3s}@keyframes fl{0%{background:var(--code-bg)}100%{background:transparent}}

/* receive */
.numlist .it{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--surface)}
.numlist .it:hover{border-color:var(--primary)}
.numlist .it.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.numlist .it .nm{font-weight:600}.numlist .it .sp{flex:1}
.steps{display:flex;flex-direction:column;gap:0;margin:6px 0 4px}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:not(:last-child):after{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}
.step.done:not(:last-child):after{background:var(--ok)}
.step .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);flex:none;font-size:12px;color:var(--fg2);z-index:1}
.step.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.step.cur .b{border-color:var(--primary);color:var(--primary)}
.step.fail .b{background:var(--bad);border-color:var(--bad);color:#fff}
.step .t{padding-top:2px}.step .t small{color:var(--fg2);margin-left:6px}
.ready{border-radius:10px;padding:18px 20px;background:var(--ok-l);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ready .big{font-size:18px;font-weight:600}
.waiting{border-radius:10px;padding:18px 20px;background:var(--primary-l);display:flex;gap:14px;align-items:center}
.spin{width:22px;height:22px;border:3px solid var(--primary-l);border-top-color:var(--primary);border-radius:50%;animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

dialog{border:0;border-radius:12px;background:var(--surface);color:var(--fg);width:min(560px,94vw);padding:0;box-shadow:0 20px 60px #0003}
dialog::backdrop{background:#0007}
dialog .card-b{padding:20px}
dialog .form{grid-template-columns:110px minmax(0,1fr)}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
#toast{position:fixed;right:20px;top:72px;display:flex;flex-direction:column;gap:8px;z-index:50}
#toast div{background:var(--fg);color:var(--surface);padding:10px 14px;border-radius:8px;max-width:420px;font-size:13px;box-shadow:0 6px 20px #0003}
#toast div.err{background:var(--bad);color:#fff}
.ev{display:flex;gap:10px;padding:9px 20px;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.ev:first-child{border-top:0}
pre.cfg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:12.5px;margin:6px 0 0}
</style>
</head>

<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo"><svg class="i"><use href="#i-sim"/></svg></div>eSIM 接码平台</div>
    <nav id="nav">
      <a href="#/overview" data-p="overview"><svg class="i"><use href="#i-dash"/></svg>概览</a>
      <a href="#/receive" data-p="receive"><svg class="i"><use href="#i-recv"/></svg>收码<span class="cnt" id="navRecv" hidden></span></a>
      <div class="grp">管理</div>
      <a href="#/numbers" data-p="numbers"><svg class="i"><use href="#i-sim"/></svg>号卡管理</a>
      <a href="#/messages" data-p="messages"><svg class="i"><use href="#i-msg"/></svg>短信记录<span class="cnt" id="navNew" hidden></span></a>
      <a href="#/send" data-p="send"><svg class="i"><use href="#i-send"/></svg>发送短信</a>
      <div class="grp">系统</div>
      <a href="#/devices" data-p="devices"><svg class="i"><use href="#i-chip"/></svg>设备管理</a>
      <a href="#/settings" data-p="settings"><svg class="i"><use href="#i-set"/></svg>系统设置</a>
      <a href="#/events" data-p="events"><svg class="i"><use href="#i-log"/></svg>事件日志</a>
      <a href="#/access" data-p="access"><svg class="i"><use href="#i-api"/></svg>接入 API / MCP</a>
    </nav>
    <div class="side-foot">
      <div id="sideStatus">…</div>
      <a href="/logout" class="row mut" style="gap:6px"><svg class="i"><use href="#i-out"/></svg>退出登录</a>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="title">概览</h1>
      <span class="sp"></span>
      <span id="topStatus"></span>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, cls='i') => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const S = {status: null, nums: [], route: 'overview', msgCursor: 0, recvSel: null, unseen: 0, msgFilter: {number: '', direction: 'in', q: ''}, msgOldest: 0};

async function api(method, path, body, isForm) {
  const opt = {method, headers: {'X-Requested-With': 'esim-admin'}};
  if (body !== undefined) { if (isForm) opt.body = body; else { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; } }
  const r = await fetch('/api/v1' + path, opt);
  if (r.status === 401) { location.href = '/'; throw new Error('未登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail || j));
  return j;
}
function toast(t, err) { const d = document.createElement('div'); d.textContent = t; if (err) d.className = 'err'; $('#toast').append(d); setTimeout(() => d.remove(), err ? 8000 : 3500); }
const now = () => Date.now() / 1000;
const dur = s => { s = Math.max(0, Math.round(s)); return s < 60 ? s + ' 秒' : s < 3600 ? Math.floor(s/60) + ' 分 ' + (s%60) + ' 秒' : Math.floor(s/3600) + ' 小时 ' + Math.floor(s%3600/60) + ' 分'; };
const ago = ts => ts ? dur(now() - ts) + '前' : '-';
const hm = iso => (iso || '').slice(5, 19).replace('T', ' ');
const numName = p => p ? (p.label || p.card_nickname || p.card_name || p.iccid) : '-';
const byIccid = i => S.nums.find(n => n.iccid === i);
const PHASE = {online:['在线','ok'], switching:['切换中','warn'], rebooting:['随身WiFi重启中','warn'], waiting_network:['等待注网','warn'],
  no_service:['无服务','bad'], mifi_offline:['随身WiFi不可达','bad'], error:['错误','bad'], idle:['无受管号码在线','warn'], starting:['启动中','mut'], disabled:['已停用','mut'], no_device:['没有设备','bad']};
const groups = () => S.status?.groups || [];
const multi = () => groups().length > 1;
const gstat = n => groups().find(g => g.group_id === n?.device_id) || S.status || {};
const gname = n => multi() && n?.group_name ? `<span class="tag mut">${esc(n.group_name)}</span>` : '';
const phaseTag = (st = S.status) => { const [t, c] = PHASE[st?.phase] || [st?.phase || '…', 'mut']; return `<span class="tag ${c}"><span class="dot ${c === 'warn' ? 'pulse' : ''}"></span>${t}</span>`; };
const recvHold = () => (S.status?.holds || []).find(h => h.reason === 'manual');

/* ----------------------------------------------------------- data refresh */
async function refresh() {
  S.status = await api('GET', '/status');
  S.nums = await api('GET', '/numbers?include_removed=' + (S.showRemoved ? 'true' : 'false'));
  const cur = S.status.current;
  $('#topStatus').innerHTML = multi()
    ? `<span class="tag ${groups().every(g => g.phase === 'online' || g.phase === 'disabled') ? 'ok' : 'warn'}"><span class="dot"></span>${groups().filter(g => g.phase === 'online').length} / ${groups().filter(g => g.phase !== 'disabled').length} 组在线</span> <span class="small" style="margin-left:8px">${groups().filter(g => g.current).map(g => esc(g.current.label || g.current.iccid)).join(' · ')}</span>`
    : `${phaseTag()} <span class="small" style="margin-left:8px">${cur ? '当前在线：<b>' + esc(cur.label || cur.iccid) + '</b> ' + esc(cur.msisdn || '') : ''}</span>`;
  const m = S.status.modem || {};
  $('#sideStatus').innerHTML = `<div class="row" style="gap:6px">${icon('wifi')}${esc(m.network_provider || '-')} ${esc(m.network_type || '')}</div><div class="mut">上次收取 ${ago(S.status.last_poll_at)}</div>`;

  $('#navNew').hidden = !S.unseen; $('#navNew').textContent = S.unseen;
}
async function pollMessages() {
  const rows = await api('GET', '/messages?since_id=' + S.msgCursor + '&limit=200&direction=');
  if (!rows.length) return [];
  const first = S.msgCursor === 0;
  S.msgCursor = Math.max(S.msgCursor, ...rows.map(r => r.id));
  if (!first) {
    const inc = rows.filter(r => r.direction === 'in');
    inc.forEach(m => toast(`新短信 · ${numName(byIccid(m.iccid))}：${m.code ? '验证码 ' + m.code : m.body.slice(0, 30)}`));
    if (S.route !== 'messages') S.unseen += inc.length;
  }
  return first ? [] : rows;
}

      <div id="msgList"><div class="empty">加载中…</div></div>
      <div class="card-b" style="text-align:center;border-top:1px solid var(--line)"><button class="btn sm" id="more">加载更多</button></div></div>`;
    $('#fNum').value = F.number; $('#fDir').value = F.direction; $('#fText').value = F.q;
    $('#fNum').onchange = $('#fDir').onchange = () => { F.number = $('#fNum').value; F.direction = $('#fDir').value; this.load(); };
    let t; $('#fText').oninput = () => { clearTimeout(t); t = setTimeout(() => { F.q = $('#fText').value.trim(); this.load(); }, 300); };
    $('#pollNow').onclick = async () => { await api('POST', '/poll'); toast('已触发收取'); };
    $('#more').onclick = () => this.load(true);
    this.load();
  },
  q(extra) {
    const F = S.msgFilter, q = new URLSearchParams({number: F.number, direction: F.direction, limit: 50, ...extra});
    if (F.q) { if (/^\+?\d{3,}$/.test(F.q)) q.set('sender', F.q); else q.set('contains', F.q); }
    return '/messages?' + q;
  },
  async load(more) {
    const rows = await api('GET', this.q(more ? {before_id: S.msgOldest} : {}));
    if (rows.length) S.msgOldest = Math.min(...rows.map(r => r.id));
    const el = $('#msgList'); if (!el) return;
    if (more) el.insertAdjacentHTML('beforeend', rows.map(m => msgHtml(m)).join(''));
    else { el.innerHTML = rows.map(m => msgHtml(m)).join('') || '<div class="empty">暂无短信</div>'; this._top = rows.length ? rows[0].id : 0; }
    $('#more').style.display = rows.length >= 50 ? '' : 'none';
  },
  async onNew(rows) {
    const el = $('#msgList'); if (!el) return;
    const fresh = await api('GET', this.q({}));
    const add = fresh.filter(r => r.id > (this._top || 0));
    if (add.length) { if (!this._top) el.innerHTML = ''; el.insertAdjacentHTML('afterbegin', add.map(m => msgHtml(m, true)).join('')); this._top = Math.max(...add.map(r => r.id)); }
  },
};

      try { await api('PATCH', '/settings', b); toast('设置已保存'); await refresh(); } catch (err) { toast(err.message, true); }
    };
  },
};

/* events */
PAGES.events = {
  async render() {
    $('#page').innerHTML = `<div class="card"><div class="card-h"><h3>最近事件</h3><span class="sp"></span><button class="btn sm" id="evR">刷新</button></div><div id="evList"></div></div>`;
    $('#evR').onclick = () => this.render();
    const ev = await api('GET', '/events?limit=200');
    $('#evList').innerHTML = ev.map(e => `<div class="ev"><span class="mut mono" style="white-space:nowrap">${esc(hm(e.ts))}</span><span class="tag ${e.level === 'error' ? 'bad' : e.level === 'warning' ? 'warn' : 'mut'}">${esc(e.kind)}</span><span>${esc(e.message)}</span></div>`).join('') || '<div class="empty">暂无事件</div>';
  },
};

/* --------------------------------------------------------------- actions */
document.addEventListener('click', async e => {
  const g = e.target.closest('[data-gedit],[data-gtoggle],[data-gdel]');
  if (g) {
    e.preventDefault();
    try {
      if (g.dataset.gedit) openGroup(g.dataset.gedit);
      else if (g.dataset.gtoggle) { const x = groups().find(y => y.group_id === g.dataset.gtoggle);
        if (x.enabled && !confirm(`停用 ${x.name}？停用后这组的号码不再收短信。`)) return;
        await api('PATCH', '/groups/' + x.group_id, {enabled: !x.enabled}); await refresh(); render(); }
      else if (g.dataset.gdel) { const x = groups().find(y => y.group_id === g.dataset.gdel);
        if (!confirm(`移除设备组 ${x.name}？卡上的号码不会被删除，只是平台不再管理这组设备。`)) return;
        await api('DELETE', '/groups/' + x.group_id); toast('已移除'); await refresh(); render(); }
    } catch (err) { toast(err.message, true); }
    return;
  }
  const t = e.target.closest('[data-pick],[data-sel],[data-start],[data-ext],[data-end],[data-edit],[data-del],[data-home],[data-copy],[data-filter]');
  if (!t) return;
  try {
    if (t.dataset.pick) { S.recvSel = t.dataset.pick; return; }
    if (t.dataset.filter) { S.msgFilter.number = t.dataset.filter; return; }
    e.preventDefault();
    if (t.dataset.sel) { S.recvSel = t.dataset.sel; PAGES.receive.update(true); }
    else if (t.dataset.start) {
      t.disabled = true;
      const tg = byIccid(t.dataset.start)?.device_id;
      const old = (S.status.holds || []).find(x => x.reason === 'manual' && x.group_id === tg);
      if (old && old.iccid !== t.dataset.start) await api('DELETE', '/holds/' + old.id);
      await api('POST', `/numbers/${t.dataset.start}/receive`, {});
      await refresh(); PAGES.receive.update(true);
    }
    else if (t.dataset.ext) { await api('POST', `/holds/${t.dataset.ext}/extend?seconds=600`); toast('已延长 10 分钟'); await refresh(); PAGES.receive.update(); }
    else if (t.dataset.end) { await api('DELETE', '/holds/' + t.dataset.end); toast('收码已结束'); await refresh(); PAGES.receive.update(true); }
    else if (t.dataset.edit) openEdit(t.dataset.edit);
    else if (t.dataset.home) {
      const p = byIccid(t.dataset.home);
      if (!confirm(`把 ${numName(p)} 设为常驻号？\n没有收码会话时，平台会切到这个号码并保持在线。`)) return;
        await api('PATCH', '/groups/' + p.device_id, {home_iccid: p.iccid}); toast('已设为常驻号'); await refresh(); render();
    }
    else if (t.dataset.del) {
      const p = byIccid(t.dataset.del);
      const v = prompt(`从卡上删除 ${numName(p)}（${p.card_provider}）？\n此操作不可撤销。\n\n请输入 ICCID 后 4 位（${'*'.repeat(4)}）确认：`);
      if (v === null) return;
      if (v.trim() !== p.iccid.slice(-4)) return toast('确认码不对，已取消', true);
      toast('正在通过蓝牙删除…');
      await api('DELETE', `/numbers/${p.iccid}?confirm=${p.iccid}`); toast('已删除'); await refresh(); render();
    }
    else if (t.dataset.copy) { await navigator.clipboard.writeText(t.dataset.copy); toast('已复制 ' + t.dataset.copy); }
  } catch (err) { toast(err.message, true); t.disabled = false; }
});
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
window.addEventListener('hashchange', go);

(async () => {
  try { await refresh(); await pollMessages(); } catch (err) { toast(err.message, true); }
  go();
  setInterval(async () => {
    try {
      await refresh();
      const rows = await pollMessages();
      const P = PAGES[S.route];
      if (rows.length && P.onNew) await P.onNew(rows);
      if (P.tick && !document.querySelector('dialog[open]')) await P.tick();
    } catch (e) { /* transient */ }
  }, 2500);
})();
</script>
